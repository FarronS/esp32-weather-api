; ===========================================================================
;  PlatformIO Project Configuration File
;  Конфигурация проекта для PlatformIO: что за плата, чем собирать/шить,
;  какие библиотеки подключать и как открывать монитор порта.
;  Полная документация: https://docs.platformio.org/page/projectconf.html
; ===========================================================================

; Каталог сборки вынесен в путь без кириллицы. Иначе линкер (ld.exe) не может
; открыть файлы по пути с русскими буквами и падает на firmware.map.
; Если проект лежит в пути без кириллицы, эту строку можно удалить —
; PlatformIO будет собирать в .pio/ внутри проекта.
[platformio]
build_dir = C:/pio_build/heltec_v4_blank

; Имя окружения (env). Одно окружение под конкретную плату:
[env:heltec_wifi_lora_32_V4]
; Платформа = пакет с тулчейном и фреймворками для чипов Espressif (ESP32/S2/S3/C3/...)
platform = espressif32
; Конкретная плата: задаёт чип (ESP32-S3), размер flash (16MB), пины (variant),
; режим прошивки и готовые build-флаги (в т.ч. ARDUINO_USB_MODE=1)
board = heltec_wifi_lora_32_V4
; Фреймворк, на котором пишем код: Arduino (а не ESP-IDF)
framework = arduino

; Таблица разделов на 16 МБ flash (по умолчанию было 4 МБ: приложение 1.25 МБ).
; Здесь app-раздел 6.5 МБ — запас под рост прошивки.
board_build.partitions = default_16MB.csv

; --- Библиотеки ---
; Драйвер экрана — локальная библиотека lib/SmallEPaper (порт oled.c из
; SmallePlayer/blink-main + шрифт с кириллицей). PlatformIO подхватывает
; папку lib/ сама, прописывать её в lib_deps не нужно.
; U8g2 больше не используется: экран рисуется через SmallEPaper.
lib_deps =

; --- Порт ---
; Порт НЕ прописан жёстко: PlatformIO сам найдёт плату (ESP32-S3 USB-Serial/JTAG
; или CH343P USB-UART). Если хотите зафиксировать — раскомментируйте и укажите
; свой номер, например upload_port = COM3.
; upload_port = COM3
; monitor_port = COM3
;
; Скорость загрузки прошивки. 460800 — заводская для этой платы и работает
; со всеми вариантами (нативный USB и USB-UART мост).
upload_speed = 460800
; Скорость самого Serial внутри прошивки (должна совпадать с Serial.begin)
monitor_speed = 115200

; --- USB CDC: Serial идёт через нативный USB-Serial/JTAG ESP32-S3 ---
; Дополнительные флаги компилятора (каждый начинается с -D, это #define):
build_flags =
    ; 1 = использовать аппаратный USB-периферийный блок (USB-Serial/JTAG) для Serial
    -DARDUINO_USB_MODE=1
    ; 1 = при старте автоматически поднимать USB-CDC, чтобы Serial выводился по USB
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- Монитор порта ---
; Фильтры, которые применяются к выводу монитора:
monitor_filters =
    ; Декодирует адреса в стек-трейсе при падении (exception) в имена функций
    esp32_exception_decoder
    ; Добавляет к каждой строке метку времени, когда она пришла
    time
