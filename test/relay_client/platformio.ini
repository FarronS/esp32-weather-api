; ===========================================================================
;  ТЕСТ РЕЛЕЯ НА ESP32-C3 SUPER MINI
;
;  Отдельный маленький проект: плата подключается к WiFi, запрашивает
;  релей-сервер (server/weather_relay.py), печатает ответ и замеряет время.
;  Для сравнения один раз делает прямой запрос в api.met.no и показывает,
;  насколько релей быстрее.
;
;  Сборка/прошивка (из корня репозитория):
;      pio run -d test/relay_client -t upload
;      pio device monitor -d test/relay_client -b 115200
;
;  Адрес релея берётся из src/secrets.h — того же файла, что и у основной
;  прошивки, поэтому второй раз вписывать не нужно.
; ===========================================================================

; Каталог сборки вне пути с кириллицей — как в основной прошивке.
[platformio]
build_dir = C:/pio_build/c3_relay_test

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

; src/secrets.h лежит в основной прошивке — подключаем его папку.
build_flags =
    -I../../src
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
